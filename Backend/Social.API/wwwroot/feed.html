<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Trọng - Bảng tin</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { themeBg: 'var(--bg-body)', themePanel: 'var(--bg-panel)', themeBorder: 'var(--border)', themeText: 'var(--text-main)', themeSub: 'var(--text-sub)', primary: 'var(--primary)' } } } }
    </script>
</head>
<body class="antialiased pt-16 h-screen overflow-y-auto transition-colors">

    <nav class="bg-themePanel shadow-sm border-b border-themeBorder fixed top-0 w-full z-50 h-16 flex items-center justify-between px-4 lg:px-10 transition-colors">
        <div class="flex items-center gap-4 w-1/2 md:w-1/3">
            <a href="feed.html" class="text-2xl font-bold text-primary hover:opacity-80 transition">Dev Trọng</a>

            <div class="relative hidden md:block w-64 group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-themeSub text-sm"></i>
                </div>
                <input type="text" id="globalSearchInput" placeholder="Tìm kiếm trên Dev Trọng..." onfocus="showSearchDropdown()" oninput="handleGlobalSearch(this.value)" class="w-full pl-9 pr-3 py-2 bg-themeBg text-themeText border border-themeBorder rounded-full focus:outline-none focus:border-primary text-sm transition">

                <div id="searchDropdown" class="absolute left-0 mt-2 w-80 bg-themePanel border border-themeBorder shadow-xl rounded-xl hidden z-50 overflow-hidden">
                    <div class="p-3 border-b border-themeBorder flex justify-between items-center">
                        <span class="font-bold text-themeText text-sm" id="searchDropdownTitle">Lịch sử tìm kiếm</span>
                        <button onclick="hideSearchDropdown()" class="text-themeSub hover:text-red-500 text-xs transition font-bold"><i class="fa-solid fa-xmark"></i> Đóng</button>
                    </div>
                    <div id="searchResultList" class="max-h-80 overflow-y-auto">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="toggleTheme()" class="text-themeSub hover:text-primary transition text-xl"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
            <div class="relative">
                <button onclick="toggleNotifDropdown()" class="text-themeSub hover:text-primary transition text-xl relative">
                    <i class="fa-solid fa-bell"></i>
                    <span id="notifBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <div id="notifDropdown" class="absolute right-0 mt-3 w-80 bg-themePanel border border-themeBorder shadow-xl rounded-xl hidden z-50 overflow-hidden">
                    <div class="p-3 border-b border-themeBorder font-bold text-themeText">Thông báo</div>
                    <div id="notifList" class="max-h-80 overflow-y-auto"></div>
                </div>
            </div>
            <a href="profile.html" class="hover:opacity-80 transition cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-primary font-bold">U</div>
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto flex justify-center gap-6 mt-6 px-4">
        <aside class="hidden lg:block w-1/4 sticky top-24 h-[calc(100vh-6rem)]">
            <ul class="space-y-2">
                <li><a href="feed.html" class="flex items-center gap-3 p-3 rounded-lg font-semibold text-primary bg-themePanel shadow-sm"><i class="fa-solid fa-house w-6 text-center text-lg"></i> Bảng tin</a></li>
                <li><a href="profile.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-themePanel font-medium text-themeText transition"><i class="fa-solid fa-user w-6 text-center text-lg text-themeSub"></i> Trang cá nhân</a></li>
                <li><a href="chat.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-themePanel font-medium text-themeText transition"><i class="fa-solid fa-comment-dots w-6 text-center text-lg text-themeSub"></i> Nhắn tin</a></li>
                <li><button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-red-50 font-medium text-red-500 transition mt-4"><i class="fa-solid fa-right-from-bracket w-6 text-center text-lg"></i> Đăng xuất</button></li>
            </ul>
        </aside>

        <main class="w-full lg:w-2/4 max-w-2xl">
            <div class="bg-themePanel rounded-xl shadow-sm border border-themeBorder p-4 mb-4 relative">
                <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar hide-scrollbar" id="storyContainer">
                    
                    <div onclick="document.getElementById('storyUploadInput').click()" class="relative w-28 h-48 rounded-xl bg-themeBg border border-themeBorder flex-shrink-0 cursor-pointer hover:opacity-90 transition group overflow-hidden flex flex-col shadow-sm">
                        <div id="myStoryAvatar" class="h-[65%] w-full bg-cover bg-center" style="background-image: url('https://i.pinimg.com/736x/c0/27/be/c027bec07c2dc08b9df60921dfd539bd.jpg');"></div>
                        <div class="h-[35%] flex flex-col items-center justify-end pb-3 relative bg-themePanel">
                            <div class="absolute -top-4 w-8 h-8 bg-primary rounded-full border-4 border-themePanel flex items-center justify-center text-white transition-transform group-hover:scale-110">
                                <i class="fa-solid fa-plus text-sm"></i>
                            </div>
                            <span class="text-xs font-bold text-themeText mt-1">Tạo tin</span>
                        </div>
                    </div>

                    <div id="friendsStoryList" class="flex gap-2"></div>
                </div>
            </div>
            
            <div class="bg-themePanel rounded-xl shadow-sm p-4 mb-6 border border-themeBorder transition-colors">
                <div class="flex gap-3">
                    <div id="feedMyAvatar" class="w-10 h-10 rounded-full bg-themeBg border border-themeBorder flex-shrink-0 shadow-sm"></div>
                    <textarea id="postContent" class="w-full bg-themeBg text-themeText border border-themeBorder rounded-xl p-3 outline-none resize-none min-h-[80px]" placeholder="Bạn đang nghĩ gì thế?"></textarea>
                </div>
                
                <div id="imagePreviewContainer" class="hidden mt-3 relative">
                    <div id="mediaPreviewContent" class="w-full max-h-64 rounded-lg overflow-hidden flex justify-center bg-black"></div>
                    <button onclick="removeImage()" class="absolute top-2 right-2 bg-gray-800/80 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-gray-700 transition"><i class="fa-solid fa-times"></i></button>
                </div>

                <div class="flex justify-between items-center mt-3 pt-3 border-t border-themeBorder">
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('postImage').click()" class="flex items-center gap-2 text-themeSub hover:bg-themeBg px-3 py-2 rounded-lg font-medium transition cursor-pointer">
                            <i class="fa-solid fa-image text-green-500 text-lg"></i> Ảnh/Video
                        </button>
                        <button onclick="toggleEmojiPicker('postContent', this)" class="emoji-btn flex items-center gap-2 text-themeSub hover:bg-themeBg px-3 py-2 rounded-lg font-medium transition cursor-pointer">
                            <i class="fa-regular fa-face-smile text-yellow-500 text-lg"></i>
                        </button>
                        <button onclick="toggleMentionPicker('postContent', this)" class="mention-btn flex items-center gap-2 text-themeSub hover:bg-themeBg px-3 py-2 rounded-lg font-medium transition cursor-pointer">
                            <i class="fa-solid fa-at text-blue-500 text-lg"></i>
                        </button>

                        <select id="postPrivacy" class="bg-themeBg text-themeText border border-themeBorder rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none cursor-pointer hover:bg-themePanel transition">
                            <option value="0">🌐 Công khai</option>
                            <option value="3">🤝 Bạn của bạn bè</option>
                            <option value="1">👥 Bạn bè</option>
                            <option value="2">🔒 Chỉ mình tôi</option>
                        </select>
                    </div>

                    <input type="file" id="postImage" accept="image/*,video/mp4,video/webm,video/quicktime" class="hidden" onchange="previewSelectedImage(event)">

                    <button id="btnSubmitPost" onclick="submitPost()" class="bg-primary hover:opacity-80 text-white font-bold py-2 px-6 rounded-lg transition disabled:opacity-50">
                        Đăng bài
                    </button>
                </div>
            </div>

            <div id="newsfeedContainer" class="space-y-4 pb-10">
                <div class="text-center text-themeSub py-10"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Đang tải bảng tin...</div>
            </div>
        </main>

        <aside class="hidden xl:block w-1/4 sticky top-24 h-[calc(100vh-6rem)]">
            <div class="bg-themePanel rounded-xl shadow-sm border border-themeBorder p-5 transition-colors">
                <h3 class="font-bold text-themeText mb-4 text-base">Gợi ý cho bạn</h3>
                <div id="suggestedUsersContainer" class="space-y-4">
                    <div class="text-center text-themeSub py-4"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>
                </div>
            </div>
        </aside>
    </div>

    <input type="file" id="storyUploadInput" accept="image/*,video/mp4,video/webm,video/quicktime" class="hidden" onchange="handleStoryUpload(event)">

    <div id="storyViewerModal" class="fixed inset-0 bg-black/95 z-[9999] hidden flex-col items-center justify-center transition-opacity">
        <button onclick="closeStoryViewer()" class="absolute top-4 right-4 text-white text-3xl hover:text-gray-400 z-50 transition"><i class="fa-solid fa-times"></i></button>

        <button onclick="prevStory()" class="absolute left-2 md:left-10 text-white text-4xl hover:text-gray-400 z-50 transition"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="nextStory()" class="absolute right-2 md:right-10 text-white text-4xl hover:text-gray-400 z-50 transition"><i class="fa-solid fa-chevron-right"></i></button>

        <div class="relative w-full max-w-md h-[85vh] bg-gray-900 rounded-xl overflow-hidden flex items-center justify-center shadow-2xl">
            <div id="storyProgressBarContainer" class="absolute top-2 left-2 right-2 flex gap-1 z-50"></div>

            <div class="absolute top-6 left-4 flex items-center gap-3 z-50">
                <div id="storyViewerAvatar" class="w-10 h-10 rounded-full border-2 border-primary overflow-hidden bg-white"></div>
                <div>
                    <div class="text-white font-bold text-sm drop-shadow-md" id="storyViewerName">Tên người dùng</div>
                    <div class="text-gray-300 text-[11px] drop-shadow-md" id="storyViewerTime">Thời gian</div>
                </div>
            </div>

            <img id="storyViewerImage" src="" class="w-full h-full object-contain transition-opacity duration-300 hidden">
            <video id="storyViewerVideo" src="" autoplay playsinline class="w-full h-full object-contain hidden"></video>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/global.js?v=128"></script>
    <script src="js/feed.js?v=109"></script>
</body>
</html>
