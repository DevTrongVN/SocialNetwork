<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Trọng - Trang cá nhân</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { themeBg: 'var(--bg-body)', themePanel: 'var(--bg-panel)', themeBorder: 'var(--border)', themeText: 'var(--text-main)', themeSub: 'var(--text-sub)', primary: 'var(--primary)' } } } }
    </script>
</head>
<body class="antialiased pt-16 h-screen overflow-y-auto transition-colors">

    <nav class="bg-themePanel shadow-sm border-b border-themeBorder fixed top-0 w-full z-50 h-16 flex items-center justify-between px-4 lg:px-10 transition-colors">
        <a href="feed.html" class="text-2xl font-bold text-primary hover:opacity-80 transition">Dev Trọng</a>
        <div class="flex items-center gap-4">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-themeBg border border-themeBorder flex items-center justify-center text-themeText hover:opacity-80 transition">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <div class="relative cursor-pointer hover:opacity-80 p-2 rounded-full transition duration-200" onclick="toggleNotifDropdown()">
                <i class="fa-solid fa-bell text-xl text-themeSub"></i>
                <span id="notifBadge" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                <div id="notifDropdown" class="absolute right-0 top-12 bg-themePanel border border-themeBorder w-80 max-h-96 overflow-y-auto shadow-xl rounded-xl hidden cursor-default z-50 p-2 text-themeText transition-colors">
                    <h3 class="font-bold text-lg p-2 border-b border-themeBorder">Thông báo mới</h3>
                    <div id="notifList"></div>
                </div>
            </div>
            <a href="profile.html" class="w-10 h-10 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center font-bold text-primary hover:opacity-80 transition">ME</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto flex justify-center gap-6 mt-6 px-4">
        
        <aside class="hidden lg:block w-1/4 sticky top-24 h-[calc(100vh-6rem)]">
            <ul class="space-y-2">
                <li><a href="feed.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-themePanel font-medium text-themeText transition"><i class="fa-solid fa-house w-6 text-center text-lg text-themeSub"></i> Bảng tin</a></li>
                <li><a href="profile.html" class="flex items-center gap-3 p-3 rounded-lg font-semibold text-primary bg-themePanel shadow-sm"><i class="fa-solid fa-user w-6 text-center text-lg"></i> Trang cá nhân</a></li>
                <li><a href="chat.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-themePanel font-medium text-themeText transition"><i class="fa-solid fa-comment-dots w-6 text-center text-lg text-themeSub"></i> Nhắn tin</a></li>
                <li><button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-red-50 font-medium text-red-500 transition mt-4"><i class="fa-solid fa-right-from-bracket w-6 text-center text-lg"></i> Đăng xuất</button></li>
            </ul>
        </aside>

        <main class="w-full xl:w-3/4 pb-10">
            <div class="bg-themePanel rounded-b-xl shadow-sm border-x border-b border-themeBorder mb-4 relative overflow-hidden transition-colors">
                
                <div id="coverPhoto" class="h-48 md:h-72 w-full bg-gray-300 dark:bg-gray-700 bg-cover bg-center transition-all" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');"></div>
                
                <div class="px-4 md:px-8 pb-6 relative flex flex-col md:flex-row items-center md:items-end gap-4 -mt-16 md:-mt-12">
                    
                    <div class="p-1 bg-themePanel rounded-full shadow-lg z-10">
                        <div id="userAvatarContainer">
                            <div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-blue-100 flex items-center justify-center text-5xl font-bold text-primary border-4 border-themePanel object-cover">
                                U
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-center md:text-left flex-1 mt-2 md:mt-0 pb-2">
                        <h1 id="profileName" class="text-3xl md:text-4xl font-extrabold text-themeText tracking-tight">Đang tải...</h1>
                        <p id="profileBio" class="text-themeText font-medium mt-2 max-w-2xl text-sm md:text-base leading-relaxed bg-themeBg/50 p-2 rounded-lg inline-block border border-themeBorder hidden"></p>
                        <p id="profileEmail" class="text-themeSub text-sm mt-1"></p>
                    </div>
                    
                    <div id="actionArea" class="mt-4 md:mt-0 flex gap-2 pb-2">
                        </div>
                </div>
            </div>

            <div class="bg-themePanel rounded-xl border border-themeBorder p-2 mb-4 flex gap-2 transition-colors overflow-x-auto">
                <button onclick="switchTab('posts')" id="tab-posts" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-primary text-white transition whitespace-nowrap">
                    <i class="fa-solid fa-newspaper mr-2"></i>Bài viết
                </button>
		<button onclick="switchTab('photos')" id="tab-photos" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm text-themeSub hover:bg-themeBg transition whitespace-nowrap">
                    <i class="fa-solid fa-image mr-2 text-green-500"></i>Ảnh
                </button>
                <button onclick="switchTab('videos')" id="tab-videos" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm text-themeSub hover:bg-themeBg transition whitespace-nowrap">
                    <i class="fa-solid fa-play mr-2 text-red-500"></i>Video
                </button>

                <button onclick="switchTab('friends')" id="tab-friends" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm text-themeSub hover:bg-themeBg transition whitespace-nowrap">
                    <i class="fa-solid fa-user-group mr-2"></i>Bạn bè
                </button>
                <button onclick="switchTab('following')" id="tab-following" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm text-themeSub hover:bg-themeBg transition whitespace-nowrap">
                    <i class="fa-solid fa-rss mr-2"></i>Đang theo dõi
                </button>
                <button onclick="switchTab('requests')" id="tab-requests" class="hidden flex-1 py-2 px-4 rounded-lg font-bold text-sm text-themeSub hover:bg-themeBg transition whitespace-nowrap">
                    <i class="fa-solid fa-envelope-open-text mr-2"></i>Lời mời
                </button>
                <button onclick="switchTab('saved')" id="tab-saved" class="hidden flex-1 py-2 px-4 rounded-lg font-bold text-sm text-themeSub hover:bg-themeBg transition whitespace-nowrap">
                    <i class="fa-solid fa-bookmark mr-2"></i>Đã lưu
                </button>
            </div>

            <div id="tabContentContainer" class="space-y-4 pb-10">
                <div class="text-center py-10 text-themeSub"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
            </div>
        </main>
        
        <aside class="hidden xl:block w-1/4 sticky top-24 h-[calc(100vh-6rem)]">
            <div class="bg-themePanel rounded-xl shadow-sm border border-themeBorder p-5 transition-colors">
                <h3 class="font-bold text-themeText mb-4 text-base">Gợi ý cho bạn</h3>
                <div id="suggestedUsersContainer" class="space-y-4">
                    <div class="text-center text-themeSub py-4"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>
                </div>
            </div>
        </aside>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/global.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
